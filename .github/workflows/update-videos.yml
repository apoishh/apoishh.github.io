# Refreshes the YouTube page (latest upload + 4 most viewed) once a day,
# even when your PC is off. You can also run it by hand from the
# Actions tab on GitHub ("Run workflow").
name: Update YouTube videos

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yt-dlp
      - run: python update_videos.py
      - name: Save changes
        run: |
          if git diff --quiet js/videos.js; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add js/videos.js
            git commit -m "Update YouTube videos"
            git push
          fi

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Photography portfolio — pre-convocation portraits and travel.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#" id="brand"></a>
    <p class="subtitle" id="subtitle"></p>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span>
    </button>
    <nav class="nav" id="nav"></nav>
    <footer class="side-footer">
      <div class="socials" id="socials"></div>
      <p class="copyright" id="copyright"></p>
    </footer>
  </aside>

  <main class="content" id="content"></main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
    <button class="lb-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
    <figure class="lb-figure">
      <img id="lbImg" alt="">
      <figcaption id="lbCaption"></figcaption>
    </figure>
    <button class="lb-next" id="lbNext" aria-label="Next">&#8250;</button>
    <span class="lb-count" id="lbCount"></span>
  </div>

  <script src="js/photos.js"></script>
  <script src="js/videos.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
